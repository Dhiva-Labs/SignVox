name: sign_vox
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.1.0+2

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  permission_handler: ^12.0.3
  flutter_tts: ^4.2.5
  path_provider: ^2.1.6
  sherpa_onnx: ^1.13.4
  just_audio: ^0.10.6
  path: ^1.9.1
  drift: ^2.34.2
  share_plus: 13.2.1
  drift_flutter: ^0.3.1
  file_picker: 12.0.0-beta.7
  speech_to_text: ^7.4.0
  wakelock_plus: ^1.7.0
  shared_preferences: ^2.5.5
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  drift_dev: ^2.34.0
  build_runner: ^2.15.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/models/
    - assets/tts/
    - assets/tts/vits-piper-en_US-ljspeech-medium/
    # Flutter's directory asset declarations are NOT recursive — each
    # subdirectory that directly contains files must be listed separately,
    # or files silently go missing from the build with no error. Verified
    # empirically during P4 (unzip -l the built APK and diff against `find`
    # on disk) after espeak-ng-data's lang/* and voices/* subfolders were
    # missing with just the parent entries above. Regenerate this list with:
    #   find assets/tts/vits-piper-en_US-ljspeech-medium/espeak-ng-data \
    #     -type f -exec dirname {} \; | sort -u
    - assets/tts/vits-piper-en_US-ljspeech-medium/espeak-ng-data/
    - assets/tts/vits-piper-en_US-ljspeech-medium/espeak-ng-data/lang/
    - assets/tts/vits-piper-en_US-ljspeech-medium/espeak-ng-data/lang/aav/
    - assets/tts/vits-piper-en_US-ljspeech-medium/espeak-ng-data/lang/art/
    - assets/tts/vits-piper-en_US-ljspeech-medium/espeak-ng-data/lang/azc/
    - assets/tts/vits-piper-en_US-ljspeech-medium/espeak-ng-data/lang/bat/
    - assets/tts/vits-piper-en_US-ljspeech-medium/espeak-ng-data/lang/bnt/
    - assets/tts/vits-piper-en_US-ljspeech-medium/espeak-ng-data/lang/ccs/
    - assets/tts/vits-piper-en_US-ljspeech-medium/espeak-ng-data/lang/cel/
    - assets/tts/vits-piper-en_US-ljspeech-medium/espeak-ng-data/lang/cus/
    - assets/tts/vits-piper-en_US-ljspeech-medium/espeak-ng-data/lang/dra/
    - assets/tts/vits-piper-en_US-ljspeech-medium/espeak-ng-data/lang/esx/
    - assets/tts/vits-piper-en_US-ljspeech-medium/espeak-ng-data/lang/gmq/
    - assets/tts/vits-piper-en_US-ljspeech-medium/espeak-ng-data/lang/gmw/
    - assets/tts/vits-piper-en_US-ljspeech-medium/espeak-ng-data/lang/grk/
    - assets/tts/vits-piper-en_US-ljspeech-medium/espeak-ng-data/lang/inc/
    - assets/tts/vits-piper-en_US-ljspeech-medium/espeak-ng-data/lang/ine/
    - assets/tts/vits-piper-en_US-ljspeech-medium/espeak-ng-data/lang/ira/
    - assets/tts/vits-piper-en_US-ljspeech-medium/espeak-ng-data/lang/iro/
    - assets/tts/vits-piper-en_US-ljspeech-medium/espeak-ng-data/lang/itc/
    - assets/tts/vits-piper-en_US-ljspeech-medium/espeak-ng-data/lang/jpx/
    - assets/tts/vits-piper-en_US-ljspeech-medium/espeak-ng-data/lang/map/
    - assets/tts/vits-piper-en_US-ljspeech-medium/espeak-ng-data/lang/miz/
    - assets/tts/vits-piper-en_US-ljspeech-medium/espeak-ng-data/lang/myn/
    - assets/tts/vits-piper-en_US-ljspeech-medium/espeak-ng-data/lang/poz/
    - assets/tts/vits-piper-en_US-ljspeech-medium/espeak-ng-data/lang/roa/
    - assets/tts/vits-piper-en_US-ljspeech-medium/espeak-ng-data/lang/sai/
    - assets/tts/vits-piper-en_US-ljspeech-medium/espeak-ng-data/lang/sem/
    - assets/tts/vits-piper-en_US-ljspeech-medium/espeak-ng-data/lang/sit/
    - assets/tts/vits-piper-en_US-ljspeech-medium/espeak-ng-data/lang/tai/
    - assets/tts/vits-piper-en_US-ljspeech-medium/espeak-ng-data/lang/trk/
    - assets/tts/vits-piper-en_US-ljspeech-medium/espeak-ng-data/lang/urj/
    - assets/tts/vits-piper-en_US-ljspeech-medium/espeak-ng-data/lang/zle/
    - assets/tts/vits-piper-en_US-ljspeech-medium/espeak-ng-data/lang/zls/
    - assets/tts/vits-piper-en_US-ljspeech-medium/espeak-ng-data/lang/zlw/
    - assets/tts/vits-piper-en_US-ljspeech-medium/espeak-ng-data/voices/!v/
    - assets/fonts/OFL.txt
    - assets/wordlist/en_common.txt
    - assets/wordlist/LICENSE

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Inter (SIL OFL 1.1 — assets/fonts/OFL.txt, registered in main.dart's
  # LicenseRegistry): the app-wide typeface. Chosen for its SF-Pro-grade
  # metrics — the whole UI is typeset to Apple HIG sizes/weights in
  # lib/theme.dart, and the system Roboto would quietly undo that look.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
        - asset: assets/fonts/Inter-Medium.otf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Inter-Bold.otf
          weight: 700
